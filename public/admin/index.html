<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin — Portfolio</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script>
      var pendingAuth = sessionStorage.getItem('__decap_pending_auth');
      if (pendingAuth) {
        sessionStorage.removeItem('__decap_pending_auth');
        // Il popup era bloccato: intercettiamo window.open per simulare il handshake
        // quando l'utente clicca di nuovo "Accedi con GitHub".
        var _origOpen = window.open.bind(window);
        window.open = function() {
          window.open = _origOpen;
          var auth = pendingAuth;
          var fakePopup = {
            closed: false,
            focus: function() {},
            close: function() { fakePopup.closed = true; },
            postMessage: function(data) {
              if (typeof data === 'string' && data.startsWith('authorizing:')) {
                window.postMessage(auth, window.location.origin);
              }
            }
          };
          setTimeout(function() {
            window.postMessage('authorizing:github', window.location.origin);
          }, 50);
          return fakePopup;
        };
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
  </body>
</html>
